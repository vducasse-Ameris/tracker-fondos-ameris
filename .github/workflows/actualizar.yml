name: Actualizar dashboard

# v2: bolsa.py reintenta con refresco de token; una falla puntual no bota la corrida.
# Corre el pipeline en la nube (independiente del PC del autor) y publica a Pages.
on:
  schedule:
    # dos veces al día: CMF publica el valor cuota del día anterior avanzada la
    # mañana en Chile, así que una corrida temprana lo perdía. La de la tarde
    # asegura tomar el último dato publicado. (Chile = UTC-4 en invierno.)
    - cron: "0 13 * * *"        # ~09:00 Chile
    - cron: "0 22 * * *"        # ~18:00 Chile — CMF ya publicó el dato del día
  workflow_dispatch: {}          # botón "Run workflow" para correr a demanda
  push:
    branches: [main]              # cualquier push humano corre (guardia anti-loop abajo)

permissions:
  contents: write                # para que el bot pueda commitear index.html

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    # el bot commitea index.html en cada corrida: su push NO debe re-disparar (evita loop)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # base de datos SQLite entre corridas (NO va al repo; solo caché privada).
      # Si la caché no existe, actualizar.py carga toda la historia (self-healing).
      - name: Restaurar base de datos
        uses: actions/cache@v4
        with:
          path: datos.db
          key: datos-db-${{ github.run_id }}
          restore-keys: |
            datos-db-

      - name: Actualizar datos y generar reporte
        run: python actualizar.py --sin-abrir

      - name: Copiar reporte a index.html
        run: |
          cp reportes/reporte.html index.html
          touch .nojekyll

      - name: Publicar (commit + push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --staged --quiet; then
            echo "Sin cambios en el dashboard."
          else
            git commit -m "Actualiza dashboard (automatico)"
            git push
          fi
