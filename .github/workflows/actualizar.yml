name: Actualizar dashboard

# v3: publica DIRECTO a GitHub Pages vía Actions (un solo camino, sin el build
# legacy "Deploy from a branch" que fallaba). Trae datos de CMF + Bolsa, genera
# el reporte y lo despliega como artefacto de Pages. No commitea nada al repo.
on:
  schedule:
    # GitHub cron es siempre UTC (no ajusta horario de verano). Chile = UTC-4 en
    # invierno. En verano (UTC-3) correrán a las 10:00 y 12:00 Chile.
    - cron: "0 13 * * *"        # 09:00 Chile
    - cron: "0 15 * * *"        # 11:00 Chile
  workflow_dispatch: {}          # botón "Run workflow" para correr a demanda
  push:
    branches: [main]             # desplegar al cambiar código/workflow

permissions:
  contents: read
  pages: write
  id-token: write

# una sola implementación de Pages a la vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # base de datos SQLite entre corridas (caché privada, NO va al repo).
      # Si no existe, actualizar.py carga toda la historia (self-healing).
      - name: Restaurar base de datos
        uses: actions/cache@v4
        with:
          path: datos.db
          key: datos-db-${{ github.run_id }}
          restore-keys: |
            datos-db-

      - name: Actualizar datos y generar reporte
        run: python actualizar.py --sin-abrir

      - name: Preparar sitio (solo index.html)
        run: |
          mkdir -p _site
          cp reportes/reporte.html _site/index.html
          touch _site/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
